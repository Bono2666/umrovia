# CI Umrovia — lint, test, migrasi check (Spec §15.2 gates, Roadmap T08)
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: umrovia
          POSTGRES_PASSWORD: umrovia
          POSTGRES_DB: umrovia_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U umrovia -d umrovia_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://umrovia:umrovia@localhost:5432/umrovia_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install dependencies
        run: pip install -r backend/requirements.lock -r backend/requirements-dev.txt
      - name: Ruff lint
        run: ruff check backend
        working-directory: .
      - name: SAST (ruff flake8-bandit, kode aplikasi)
        run: ruff check --select S backend/modules backend/config backend/common
        working-directory: .
      - name: Audit kerentanan dependensi Python
        run: pip-audit -r backend/requirements.lock
        working-directory: .
      - name: Django system check
        run: python manage.py check
        working-directory: backend
      - name: Deploy check dengan setting produksi
        run: |
          export DJANGO_SETTINGS_MODULE=config.settings.production ALLOWED_HOSTS=api.umrovia.com
          export SECRET_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(50))')"
          export PII_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())')"
          python manage.py check --deploy --fail-level ERROR
        working-directory: backend
      - name: Migrasi reproducible (tanpa perubahan tersimpan)
        run: python manage.py makemigrations --check --dry-run
        working-directory: backend
      - name: Terapkan migrasi (baseline rehearsal)
        run: python manage.py migrate --noinput
        working-directory: backend
      - name: Rollback rehearsal (migrasi mundur 1 langkah lalu maju lagi)
        run: |
          python manage.py migrate tenants 0001 --noinput
          python manage.py migrate --noinput
        working-directory: backend
      - name: Tests (pytest)
        run: pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Audit kerentanan dependensi produksi
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck + build
        run: npm run build
